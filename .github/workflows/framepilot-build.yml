name: Build FramePilot Android APK
on:
  push:
    branches: ['build/framepilot-ai-20261119']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore FramePilot sources
        shell: bash
        run: |
          mkdir -p framepilot
          printf '%s' '' | base64 -d | tar -xJf - -C framepilot
          test -f framepilot/app/build.gradle.kts
      - name: Build Android APK
        run: gradle -p framepilot --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FramePilot-AI-Debug-APK
          path: framepilot/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK
        shell: bash
        run: |
          cp framepilot/app/build/outputs/apk/debug/app-debug.apk FramePilot-AI-Android-Debug.apk
          sha256sum FramePilot-AI-Android-Debug.apk > FramePilot-AI-Android-Debug.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FramePilot-AI-Android-Debug.apk FramePilot-AI-Android-Debug.apk.sha256
          git commit -m 'build: publish FramePilot debug APK' || exit 0
          git push origin HEAD:build/framepilot-ai-20261119
